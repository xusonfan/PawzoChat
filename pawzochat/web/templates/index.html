{% include "_pwa_head.html" %}

<link rel="stylesheet" href="{{ request.script_root }}/static/desktop.css">
<script data-base="{{ request.script_root }}">window.PAWZOCHAT_BASE = document.currentScript.dataset.base;</script>
<script>
(function(){
  try {
    if (matchMedia("(min-width: 768px)").matches) return;
    if (!(matchMedia("(display-mode: standalone)").matches || navigator.standalone === true)) return;

    var key = "pawzoNavigation";
    var currentState = history.state || {};
    var currentRoute = currentState[key];
    if (currentRoute && currentRoute.rootGuard === true && Number(currentRoute.index) > 0) return;

    var session = currentRoute && currentRoute.rootGuard === true
      ? currentRoute.session
      : Date.now() + "-" + Math.random().toString(36).slice(2);
    var rootRoute = { session: session, index: 0, tab: "chat", depth: 0, rootGuard: true };
    history.replaceState(Object.assign({}, currentState, { [key]: rootRoute }), "", location.href);
    history.pushState(
      Object.assign({}, currentState, { [key]: Object.assign({}, rootRoute, { index: 1 }) }),
      "",
      location.href
    );
  } catch (e) {}
})();
</script>
<script>
(function(){
  try {
    var raw = localStorage.getItem("pawzo_theme_cache");
    var mode;
    if (raw) {
      var t = JSON.parse(raw);
      mode = t && t.mode;
    }
    if (!mode) mode = "{{ theme_mode }}";
    var resolved = mode === "auto"
      ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : (mode === "dark" ? "dark" : "light");
    document.documentElement.dataset.theme = resolved;
    if (raw) {
      var t2 = JSON.parse(raw);
      if (t2 && typeof t2.css === "string" && t2.css) {
        var el = document.createElement("style");
        el.id = "pawzo-theme-early";
        el.textContent = t2.css;
        document.head.appendChild(el);
      }
    }
    var themeMeta = document.querySelector('meta[name="theme-color"]');
    var topBarColor = getComputedStyle(document.documentElement).getPropertyValue("--card").trim();
    if (themeMeta && topBarColor) themeMeta.setAttribute("content", topBarColor);
  } catch (e) {}
})();
</script>
</head>
