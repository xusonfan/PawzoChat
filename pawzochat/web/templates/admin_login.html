<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060b13">
<title>PawzoChat 管理后台</title>
<link rel="icon" type="image/png" href="{{ request.script_root }}/static/logo.png">
<style>
  :root {
    color-scheme: dark;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
    --bg-body: #060b13;
    --card-bg: rgba(13, 20, 36, 0.78);
    --border: rgba(148, 163, 184, 0.14);
    --border-hover: rgba(56, 189, 248, 0.4);
    --primary: #38bdf8;
    --primary-grad: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    --primary-shadow: 0 4px 20px -2px rgba(56, 189, 248, 0.35);
    --text-1: #f8fafc;
    --text-2: #94a3b8;
    --text-3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--bg-body);
    background-image:
      radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 45%),
      radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.08) 0px, transparent 60%);
    color: var(--text-1);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    position: relative;
    width: min(100%, 400px);
    padding: 36px 32px 32px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--card-bg);
    box-shadow: 0 24px 70px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6), transparent);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .brand-logo-wrap {
    position: relative;
    display: grid;
    place-items: center;
  }
  .brand-logo-wrap img {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    box-shadow: 0 8px 16px -2px rgba(0,0,0,0.4);
  }
  .brand-logo-wrap::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 16px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    pointer-events: none;
  }
  .brand-info h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .brand-info .subtitle {
    margin-top: 3px;
    color: var(--text-2);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-admin {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.12);
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .field-group {
    margin-bottom: 20px;
  }
  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 500;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-3);
    pointer-events: none;
    transition: color 0.15s ease;
  }
  input {
    width: 100%;
    padding: 13px 42px 13px 40px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: rgba(8, 14, 26, 0.7);
    color: #f8fafc;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  input:hover {
    border-color: rgba(148, 163, 184, 0.25);
  }
  input:focus {
    border-color: var(--primary);
    background: rgba(8, 14, 26, 0.95);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15), 0 0 20px -4px rgba(56, 189, 248, 0.2);
  }
  .input-wrapper:focus-within .input-icon {
    color: var(--primary);
  }
  .toggle-pw {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 6px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    transition: color 0.15s ease;
  }
  .toggle-pw:hover {
    color: var(--text-1);
  }
  button.submit-btn {
    width: 100%;
    margin-top: 4px;
    padding: 13px 18px;
    border: none;
    border-radius: 12px;
    background: var(--primary-grad);
    box-shadow: var(--primary-shadow);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button.submit-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px -2px rgba(56, 189, 248, 0.5);
  }
  button.submit-btn:active {
    transform: translateY(0);
  }
  button.submit-btn:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
  }
  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #fca5a5;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .message svg {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 1px;
  }
  .setup {
    background: rgba(245, 158, 11, 0.1);
    border-color: rgba(245, 158, 11, 0.25);
    color: #fcd34d;
  }
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 24px;
    color: var(--text-2);
    font-size: 13px;
    text-decoration: none;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .back-link:hover {
    color: var(--text-1);
    transform: translateX(-2px);
  }
  .back-link svg {
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>
<form class="login-card" method="POST" action="{{ request.script_root }}/admin/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="brand">
    <div class="brand-logo-wrap">
      <img src="{{ request.script_root }}/static/logo.png" alt="PawzoChat">
    </div>
    <div class="brand-info">
      <h1>PawzoChat</h1>
      <div class="subtitle">人物管理后台 <span class="badge-admin">Admin</span></div>
    </div>
  </div>
  {% if configured %}
  <div class="field-group">
    <label for="password">
      <span>管理员密码</span>
    </label>
    <div class="input-wrapper">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <input id="password" type="password" name="password" autocomplete="current-password" placeholder="请输入管理密码" autofocus required>
      <button type="button" class="toggle-pw" id="toggle-password" aria-label="显示/隐藏密码">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>
  <button type="submit" class="submit-btn">
    <span>进入管理后台</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"></path>
      <path d="m12 5 7 7-7 7"></path>
    </svg>
  </button>
  {% else %}
  <div class="message setup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div>尚未设置管理员密码。请返回本地 PawzoChat 面板，在“设置 → 网络设置 → 管理员密码”中完成设置。</div>
  </div>
  {% endif %}
  {% if error %}
  <div class="message">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <div>{{ error }}</div>
  </div>
  {% endif %}
  <a class="back-link" href="{{ request.script_root }}/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"></path>
    </svg>
    <span>返回聊天面板</span>
  </a>
</form>
<script>
  const form = document.querySelector("form");
  const toggleBtn = document.getElementById("toggle-password");
  const pwInput = document.getElementById("password");
  const eyeIcon = document.getElementById("eye-icon");

  if (toggleBtn && pwInput) {
    toggleBtn.addEventListener("click", () => {
      const isPw = pwInput.type === "password";
      pwInput.type = isPw ? "text" : "password";
      eyeIcon.innerHTML = isPw
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });
  }

  form.addEventListener("submit", () => {
    const button = form.querySelector("button[type='submit']");
    if (!button || button.disabled) return;
    button.disabled = true;
    button.innerHTML = '<span>验证中…</span>';
  });
</script>
</body>
</html>
